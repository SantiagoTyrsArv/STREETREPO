version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
    groups:
      # playwright-core lo pide @axe-core/playwright y debe ser la misma versión que usa
      # @playwright/test; si se separan, los tipos de Page chocan (fila 143).
      playwright:
        patterns: ["@playwright/test", "playwright-core"]
      # vitest y @vitest/coverage-v8 piden la misma versión exacta: separados, la CI falla (#41).
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # React 18 por el plan de la fase 6 (react-leaflet 4); migrar a 19 es una decisión aparte.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-leaflet
        update-types: ["version-update:semver-major"]
      # TypeScript 7 y ESLint 10 esperan a sus dependientes (fila 135 de la bitácora):
      # openapi-typescript no acepta TypeScript 7 y eslint-plugin-jsx-a11y no acepta ESLint 10.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "@types/three"]
    ignore:
      # React, fiber y drei van juntos (React 19 exige fiber 9 y drei 10; fila 150).
      - dependency-name: "@react-three/fiber"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-three/drei"
        update-types: ["version-update:semver-major"]
      # Mismas versiones de TypeScript y ESLint que el panel (fila 135 de la bitácora).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  # App Flutter (fila 141 de la bitácora): la revisión de seguridad de la fase 8 encontró que no se vigilaba.
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      # Python 3.13 por la decisión 2; quitar esta regla si se decide migrar a 3.14 o superior.
      - dependency-name: python
        versions: [">= 3.14"]
      # nginx: solo parches de la rama estable. Los minor impares son la rama de desarrollo y
      # el patrón de versiones no reconoce las etiquetas «-alpine», así que se excluyen todos los
      # minor; el paso a la siguiente estable se hace a mano (filas 135 y 136).
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
