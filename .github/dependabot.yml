version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      # Python 3.13 por la decisión 2; quitar esta regla si se decide migrar a 3.14 o superior.
      - dependency-name: python
        versions: [">= 3.14"]
