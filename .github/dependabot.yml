version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
    ignore:
      # React 18 por el plan de la fase 6 (react-leaflet 4); migrar a 19 es una decisión aparte.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-leaflet
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      # Python 3.13 por la decisión 2; quitar esta regla si se decide migrar a 3.14 o superior.
      - dependency-name: python
        versions: [">= 3.14"]
