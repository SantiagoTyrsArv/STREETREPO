name: E2E del panel

# Pruebas de punta a punta del panel (Playwright) contra el stack real de Docker Compose:
# flujos de priorización, estado y pesos, la ronda de evaluación a ciegas y la revisión de
# accesibilidad con axe (fila 151 de la bitácora). Van aparte de la CI principal porque
# levantan la base, la API y el panel y tardan más.
#
# Datos de OSM: el script los carga desde infra/e2e/osm-pasto.sql.gz (datos © OpenStreetMap,
# ODbL). No se consulta Overpass, que no responde desde los servidores de GitHub (fila 152).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "admin-web/**"
      - "infra/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # LTS
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Instalar el panel y el navegador de Playwright
        working-directory: admin-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: .env de prueba (claves aleatorias de esta ejecución)
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Pruebas de punta a punta
        env:
          E2E_OSM_DUMP: ${{ github.workspace }}/infra/e2e/osm-pasto.sql.gz
        run: infra/scripts/e2e-panel.sh --reporter=list
      - name: Informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e
          path: |
            admin-web/test-results
            admin-web/playwright-report
          retention-days: 7
