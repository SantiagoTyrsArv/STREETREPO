name: CI

on:
  push:
    branches: ["**"] # también las ramas de trabajo, para avisar antes de integrar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, no solo el último commit
      - name: Instalar gitleaks (versión fija y suma verificada)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Buscar secretos en el historial
        run: ./gitleaks git --redact --verbose .

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: streetrepo_test
          POSTGRES_USER: streetrepo
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streetrepo" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_DB: streetrepo_test
      POSTGRES_USER: streetrepo
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # Toma required-version de aquí; sin esto busca en la raíz e instala la última.
          version-file: backend/pyproject.toml
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Migraciones
        run: uv run alembic upgrade head
      - name: Pruebas (unitarias + integración)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Guardar informe de cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: backend/coverage.xml
          retention-days: 7
      - name: Auditoría de dependencias
        run: uv export --frozen --no-dev --no-hashes -o /tmp/req.txt && uv run pip-audit -r /tmp/req.txt

  sonar:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # el historial completo permite detectar el código nuevo
      - name: Recuperar informe de cobertura
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-backend
          path: backend
      - name: Análisis de SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # El plan gratuito no deja consultar la puerta de otras ramas: se espera solo en main.
          args: -Dsonar.qualitygate.wait=${{ github.ref == 'refs/heads/main' }}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, secrets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen de la API
        run: docker build -f infra/docker/api.Dockerfile -t street-repo-api:ci backend
