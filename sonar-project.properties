# Análisis de SonarQube Cloud (propuesta 22). El token llega solo por el secreto SONAR_TOKEN.
sonar.organization=santiagotyrsarv
sonar.projectKey=SantiagoTyrsArv_STREETREPO
sonar.projectName=STREETREPO

# Por ahora solo el backend; el panel y la app se añaden en sus fases.
sonar.sources=backend/app
sonar.tests=backend/tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.sourceEncoding=UTF-8

# Propuesta 28: en main el análisis espera la puerta de calidad y el job falla si no pasa
# (sonar.qualitygate.wait se activa desde ci.yml). Un falso positivo se marca en
# SonarQube Cloud, no se esquiva aquí.
sonar.qualitygate.timeout=300
