# Panel administrativo: SPA estática. Plantilla de nginx: ${API_ORIGIN} y ${TILE_ORIGIN} se
# sustituyen al arrancar el contenedor (variables de entorno de la imagen).

# Cabeceras de seguridad (guía 7.3). Van aquí y no dentro de cada «location»: un «location»
# con su propio add_header dejaría de heredarlas; por eso la caché usa «expires».
# HSTS lo añade el proxy HTTPS (HU-17): sobre HTTP los navegadores lo ignoran.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: ${TILE_ORIGIN}; font-src 'self'; connect-src 'self' ${API_ORIGIN}; frame-ancestors 'none'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex" always;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite pone un hash del contenido en el nombre: se pueden guardar un año.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Cualquier otra ruta la resuelve el enrutador de la SPA; index.html no se guarda en
    # caché para que un despliegue nuevo se vea de inmediato.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
