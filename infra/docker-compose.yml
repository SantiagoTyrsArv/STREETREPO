# Entorno de desarrollo: docker compose -f infra/docker-compose.yml --env-file .env up --build
name: street-repo

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  OSM_BBOX: ${OSM_BBOX:-1.16,-77.33,1.25,-77.23}
  OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
  OSM_USER_AGENT: ${OSM_USER_AGENT:-StreetRepo/0.1}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY en .env}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  REGISTER_PER_IP_PER_HOUR: ${REGISTER_PER_IP_PER_HOUR:-30}
  PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-1.0}
  PRIVACY_POLICY_URL: ${PRIVACY_POLICY_URL:-}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  REPORT_AREA_BBOX: ${REPORT_AREA_BBOX:-1.16,-77.33,1.25,-77.23}
  REPORTS_PER_USER_PER_HOUR: ${REPORTS_PER_USER_PER_HOUR:-10}
  REPORTS_PER_IP_PER_HOUR: ${REPORTS_PER_IP_PER_HOUR:-100}
  PHOTO_STORAGE_DIR: /srv/storage/photos

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: ../infra/docker/api.Dockerfile
    environment: *api-env
    ports:
      # API_BIND_ADDRESS=<ip-lan> la publica en la red local para probar la app en el celular.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      # Fotos de evidencia fuera de la base (propuesta 34); entra en los respaldos (README).
      - photos:/srv/storage/photos
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-web:
    build:
      context: ..
      dockerfile: infra/docker/admin-web.Dockerfile
      args:
        # Origen de la API tal como lo ve el navegador; queda dentro del JavaScript.
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:-http://localhost:8000}
        # Vacío = teselas públicas de OpenStreetMap (guía 3.1).
        VITE_TILE_URL: ${ADMIN_TILE_URL:-}
    environment:
      # Orígenes que la CSP del panel permite: la API y el proveedor de teselas.
      API_ORIGIN: ${ADMIN_API_BASE_URL:-http://localhost:8000}
      TILE_ORIGIN: ${ADMIN_TILE_ORIGIN:-https://tile.openstreetmap.org}
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  db-data:
  photos:
